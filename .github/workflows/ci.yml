name: ALPINEX CI Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  backend-test:
    name: Backend Unit Tests & Race Detection
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.23'
          cache: true

      - name: Run Backend Tests
        run: go test -v -race -coverprofile=coverage.out ./internal/...

      - name: Build Binaries
        run: |
          go build -o bin/alpinex-api cmd/api/main.go
          go build -o bin/alpinex-worker cmd/worker/main.go
          go build -o bin/alpinex cmd/cli/main.go

  frontend-build:
    name: Frontend Build & Typecheck
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: web/package-lock.json

      - name: Install & Build Web Frontend
        run: |
          cd web
          npm ci
          npm run build
