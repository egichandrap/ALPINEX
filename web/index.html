<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='%236366f1'><polygon points='12 2 2 22 22 22'/></svg>" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ALPINEX — API Testing & Performance Engineering Platform</title>
    <style>
      :root {
        --bg-main: #0b0f19;
        --bg-card: #111827;
        --border-color: #1f2937;
        --text-primary: #f9fafb;
        --text-secondary: #9ca3af;
        --primary: #6366f1;
        --primary-hover: #4f46e5;
        --success: #10b981;
        --danger: #ef4444;
        --warning: #f59e0b;
      }
      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      }
      body {
        background-color: var(--bg-main);
        color: var(--text-primary);
        min-height: 100vh;
        overflow-x: hidden;
      }
      ::-webkit-scrollbar {
        width: 6px;
        height: 6px;
      }
      ::-webkit-scrollbar-track {
        background: transparent;
      }
      ::-webkit-scrollbar-thumb {
        background: #374151;
        border-radius: 4px;
      }
      ::-webkit-scrollbar-thumb:hover {
        background: #4b5563;
      }
      * {
        scrollbar-width: thin;
        scrollbar-color: #374151 transparent;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
